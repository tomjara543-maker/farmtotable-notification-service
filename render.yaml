services:
  - type: web
    name: farmtotable-notification-service
    runtime: docker
    region: virginia
    plan: free
    autoDeploy: false
    healthCheckPath: /health
    envVars:
      - key: SERVICE_NAME
        value: notification-service
      - key: DATABASE_URL
        sync: false
      - key: RABBITMQ_URL
        sync: false
      - key: INTERNAL_TOKEN
        sync: false
      - key: PRODUCER_SERVICE_URL
        sync: false
      - key: AUTH_SERVICE_URL
        sync: false
